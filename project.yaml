schema_version: "1.0.0"
slug: "urunc"
name: "urunc"
description: "An OCI- and CRI-compatible sandboxed container runtime that runs each container as a unikernel or single-application kernel in its own minimal, strongly isolated sandbox. With a pluggable design for sandbox monitors and guests, urunc supports diverse VM-based and software-based sandboxes and integrates seamlessly with cloud-native architectures."
